<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 
<head>
	<meta charset="UTF-8">
	<title>都道府県一覧</title>
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
 
<body>
	<h1>都道府県一覧</h1>
	<table>
		<tr>
			<th>ID</th>
			<th>都道府県名</th>
			<th>最大月額料金</th>
		</tr>
		<tr th:each="p:${prefectureList}">
			<td>[[${p.id}]]</td>
			<td>[[${p.prefecture}]]</td>
			<td>[[${#numbers.formatInteger(p.maxMonthlyPrice, 1, 'COMMA')}]]円
			</td>
		</tr>
 
	</table>
</body>
 
</html>
